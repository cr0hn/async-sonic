[project]
name = "async-sonic"
version = "0.1.0"
description = "Cliente asyncio de Sonic sin dependencias"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []
classifiers = ["Framework :: AsyncIO", "Typing :: Typed"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "pyright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/async_sonic"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF", "A"]
ignore = [
    "A002",  # `object` es el nombre que usa el protocolo
    "E501",  # los docstrings llevan su ejemplo en una linea
    "ASYNC109",  # `timeout` es un parametro de configuracion, no de asyncio.timeout
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: necesita un Sonic real (docker)"]
