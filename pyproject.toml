[project]
name = "async-sonic"
version = "0.1.0"
description = "A zero-dependency, fully typed asyncio client for the Sonic search index, with connection pooling and pipelining."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []
authors = [{ name = "Daniel Alfocea", email = "cr0hn@cr0hn.com" }]
keywords = ["sonic", "sonic-search", "search", "asyncio", "async", "client", "pipelining", "connection-pool", "typed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database :: Front-Ends",
    "Topic :: Internet",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/cr0hn/async-sonic"
Repository = "https://github.com/cr0hn/async-sonic"
Issues = "https://github.com/cr0hn/async-sonic/issues"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "pyright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/async_sonic"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF", "A"]
ignore = [
    "A002",  # `object` is the name the protocol uses
    "E501",  # docstrings carry their example on a single line
    "ASYNC109",  # `timeout` is a configuration parameter, not an asyncio.timeout argument
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs a real Sonic (docker)"]
